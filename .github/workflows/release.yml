name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'The type of version to release (alpha | beta | release)'
        default: 'beta'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: 1.21.1-Neoforged
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build
        uses: ./.github/actions/build_setup
        with:
          update-cache: 'true'

      - name: Read and Validate Release Metadata
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$RELEASE_BRANCH" ]]; then
            echo "Releases must be dispatched from $RELEASE_BRANCH, not $GITHUB_REF_NAME." >&2
            exit 1
          fi
          mod_version="$(sed -nE 's/^mod_version[[:space:]]*=[[:space:]]*(.*)$/\1/p' gradle.properties | xargs)"
          minecraft_version="$(sed -nE 's/^minecraft[[:space:]]*=[[:space:]]*"([^"]+)"$/\1/p' gradle/libs.versions.toml | xargs)"
          if [[ ! "$mod_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid mod_version: $mod_version" >&2
            exit 1
          fi
          if [[ ! "$minecraft_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Minecraft version: $minecraft_version" >&2
            exit 1
          fi
          if ! grep -Fqx "# Cosmic Core $mod_version" changelog.md; then
            echo "changelog.md must contain an exact '# Cosmic Core $mod_version' heading." >&2
            exit 1
          fi
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          echo "artifact=build/libs/cosmiccore-$minecraft_version-$mod_version.jar" >> "$GITHUB_OUTPUT"

      - name: Build Project
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" spotlessCheck build --build-cache --no-daemon

      - name: Validate Release Artifact
        shell: bash
        env:
          ARTIFACT: ${{ steps.project.outputs.artifact }}
        run: |
          set -euo pipefail
          test -f "$ARTIFACT"
          jar tf "$ARTIFACT" | grep -Fqx 'META-INF/neoforge.mods.toml'
          jar tf "$ARTIFACT" | grep -Fqx 'META-INF/jarjar/metadata.json'
          jar tf "$ARTIFACT" | grep -Fqx 'META-INF/jarjar/gtceu-1.21.1-8.0.0.jar'
          ! jar tf "$ARTIFACT" | grep -Fq 'META-INF/jarjar/ldlib'
          jar tf "$ARTIFACT" | grep -Fqx 'META-INF/jarjar/nebulaeae2-0.1.0.jar'

      - name: Publish NeoForge Release to CurseForge and GitHub
        id: neoforge_release
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: ${{ vars.CURSE_ID }}
          curseforge-token: ${{ secrets.CURSE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: false
          github-tag: "${{ steps.project.outputs.minecraft_version }}-${{ steps.project.outputs.mod_version }}"
          github-commitish: ${{ github.sha }}

          files: ${{ steps.project.outputs.artifact }}
          name: "Cosmic Core ${{ steps.project.outputs.mod_version }} for NeoForge ${{ steps.project.outputs.minecraft_version }}"
          version: ${{ steps.project.outputs.mod_version }}
          version-type: ${{ inputs.version_type }}
          changelog-file: changelog.md
          loaders: neoforge
          game-versions: ${{ steps.project.outputs.minecraft_version }}
          game-version-filter: none
          environment: client | server
          java: 21
