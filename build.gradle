plugins {
    id "java-library"
    id 'eclipse'
    id 'idea'
    id "maven-publish"

    alias libs.plugins.modDevGradle
    alias libs.plugins.spotless
    alias libs.plugins.lombok
}

group = maven_group
version = mod_version
boolean isCI = System.getenv("CI") != null

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Force re-resolution of snapshot/changing modules (ldlib snapshots, etc.)
configurations.all {
    // cc-tweaked-1.21.1-forge is a Forge jar that leaks in transitively via KubeJS. It is not a NeoForge
    // build and not part of the pack, and its Forge-style onServerStarted tab rebuild is what first exposed
    // the creative-tab duplicate (now fixed properly in CosmicCreativeModeTabs#deduplicating). Dropping the
    // stray Forge jar regardless; add a NeoForge ComputerCraft explicitly if it is ever actually wanted.
    exclude group: 'cc.tweaked'
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
        // Create transitively pulls an old JEI (19.21.0.247); gtceu/kubejs require >= 19.25.x.
        // Force the JEI runtime to the catalog-pinned version.
        def jeiVersion = forge.versions.jei.get()
        force "mezz.jei:jei-1.21.1-common-api:${jeiVersion}"
        force "mezz.jei:jei-1.21.1-neoforge-api:${jeiVersion}"
        force "mezz.jei:jei-1.21.1-neoforge:${jeiVersion}"
    }
}

sourceSets {
    // Include resources generated by data generators.
    main.resources {
        srcDir 'src/generated/resources'
    }
}

apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/dependencies.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/gradle/scripts/spotless.gradle"

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:-removal"
    options.compilerArgs << "-Aquiet=true"
    options.compilerArgs << "-Xmaxerrs" << "100000"
    options.compilerArgs << "-Xmaxwarns" << "100000"
}

lombok {
    version = "1.18.38"
}
