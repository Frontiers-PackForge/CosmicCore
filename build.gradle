plugins {
    id "java-library"
    id 'eclipse'
    id 'idea'
    id "maven-publish"

    alias libs.plugins.modDevGradle
    alias libs.plugins.spotless
    alias libs.plugins.lombok
}

group = maven_group
version = mod_version
boolean isCI = System.getenv("CI") != null

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Force re-resolution of snapshot/changing modules (ldlib snapshots, etc.)
configurations.all {
    // cc-tweaked-1.21.1-forge is a Forge jar that leaks in transitively via KubeJS. It is not a NeoForge
    // build and not part of the pack, and its Forge-style onServerStarted tab rebuild is what first exposed
    // the creative-tab duplicate (now fixed properly in CosmicCreativeModeTabs#deduplicating). Dropping the
    // stray Forge jar regardless; add a NeoForge ComputerCraft explicitly if it is ever actually wanted.
    exclude group: 'cc.tweaked'
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
        // Create transitively pulls an old JEI (19.21.0.247); gtceu/kubejs require >= 19.25.x.
        // Force the JEI runtime to the catalog-pinned version.
        def jeiVersion = forge.versions.jei.get()
        force "mezz.jei:jei-1.21.1-common-api:${jeiVersion}"
        force "mezz.jei:jei-1.21.1-neoforge-api:${jeiVersion}"
        force "mezz.jei:jei-1.21.1-neoforge:${jeiVersion}"
    }
}

sourceSets {
    // Include resources generated by data generators.
    main.resources {
        srcDir 'src/generated/resources'
    }

    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

// --- Sodium 0.8.x (dev-only render testing) --------------------------------------------------------------
// Sodium 0.8 ships on caffeinemc maven as a 3-artifact set (-api / -mod / the production "shell"). The shell
// claims modId "sodium", which on a dev classpath would shadow the real sodium-neoforge-mod and make the game
// report "sodium is not installed". So we strip the shell down to a plain LIBRARY (drop its mod metadata) and
// load sodium-neoforge-mod as the actual mod, plus Sinytra's Forgified Fabric API shims for the FRAPI paths 0.8
// needs. Pattern from SrRapero720/chloride (1.21.1-neo), adapted from NeoGradle to ModDevGradle.
// Defined here (before the dependency/repository applies) so dependencies.gradle can use the config + task.
ext.sodiumNeoVersion = "0.8.12-beta.1+mc1.21.1"

configurations {
    sodiumShell { transitive = false }
    spaceGravityRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    mixinSquaredRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    runtimeOnly.extendsFrom mixinSquaredRuntime
}

tasks.register('stripSodiumShell', Jar) {
    archiveBaseName = 'cc-sodium-neoforge-shell-lib'
    archiveVersion = (sodiumNeoVersion as String).replace('+', '-')
    destinationDirectory = layout.buildDirectory.dir('sodium-shell-lib')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.sodiumShell.collect { zipTree(it) } }
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'META-INF/jarjar/**'
    exclude 'META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator'
    manifest {
        attributes(
                'FMLModType': 'LIBRARY',
                'Automatic-Module-Name': 'sodium_service'
        )
    }
}

apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"

apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/dependencies.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/gradle/scripts/spotless.gradle"

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:-removal"
    options.compilerArgs << "-Aquiet=true"
    options.compilerArgs << "-Xmaxerrs" << "100000"
    options.compilerArgs << "-Xmaxwarns" << "100000"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    def testWorkDirectory = layout.buildDirectory.dir('test-work')
    workingDir(testWorkDirectory)
    doFirst {
        testWorkDirectory.get().asFile.mkdirs()
    }
}

lombok {
    version = "1.18.38"
}
