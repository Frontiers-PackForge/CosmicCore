dependencies {
    compileOnly(libs.jetbrains.annotations)

    // GTCEu — core dependency. Bundles (jarJar) LDLib + Registrate + Configuration at runtime,
    // so those are declared compileOnly here and provided by GTCEu in dev/prod.
    implementation(files("libs/gtceu-1.21.1-8.0.0.jar"))
    compileOnly(forge.ldlib)
    compileOnly(forge.registrate)
    compileOnly(forge.configuration)
    implementation("curse.maven:world-stripper-250603:5592921")

    // KubeJS (real, in-use scripts)
    implementation(forge.kubejs)
    implementation(forge.rhino)
    implementation(forge.architectury)

    // Recipe Viewers — pack runs EMI + TMRV (no JEI at runtime); JEI kept compileOnly for its API.
    // TMRV is a runtime-only viewer bridge shipped by the pack; CC compiles nothing against it.
    compileOnly(forge.bundles.jei)
    implementation(forge.emi)

    // WAILA-likes
    implementation(forge.jade)

    // Curios
    compileOnly(variantOf(forge.curios) { classifier("api") })
    runtimeOnly(forge.curios)

    // AE2 stack (upstream, matching the pack)
    implementation(forge.ae2)
    implementation(forge.guideme)
    implementation(forge.ae2wtlib)
    implementation(forge.clothconfig)

    // Create
    compileOnly(variantOf(forge.create) { classifier("slim") })
    compileOnly(forge.ponder)
    compileOnly(forge.flywheel.api)
    runtimeOnly(forge.create) {
        // Create's published metadata leaks optional integrations as runtime deps. The pack uses Xaero's,
        // not JourneyMap, and the bundled JourneyMap beta is incompatible with our compile-time journeymap-api
        // (it expects journeymap.api.v2...PluginHelper, absent in 2.0.0-SNAPSHOT) -> NoClassDefFoundError on init.
        exclude group: 'maven.modrinth', module: 'journeymap'
    }
    runtimeOnly(forge.flywheel.impl)

    // Magic / content mods
    implementation(forge.malum)
    implementation(forge.lodestone)
    implementation(forge.occultism) {
        // Occultism pulls SmartBrainLib under net.tslat.smartbrainlib; the Modrinth jar below provides the same classes.
        exclude group: 'net.tslat.smartbrainlib'
    }
    implementation(forge.modonomicon)
    implementation(forge.smartbrainlib)
    implementation(forge.geckolib)

    // Apotheosis (modular on 1.21.1)
    // Placebo is provided transitively by the Apothic mods as dev.shadowsoffire:Placebo. Declaring it
    // separately as maven.modrinth:placebo put two distinct coordinates of the same mod on the classpath,
    // so Placebo loaded twice and double-registered (placebo:button_click, enchanting_stats). CC has no
    // direct Placebo usage, so let Apothic supply the single canonical copy.
    implementation(forge.apothicattributes)
    implementation(forge.apothicenchanting)
    implementation(forge.apothicspawners)

    // Patchouli
    implementation(forge.patchouli)

    // Legendary Survival Overhaul
    implementation(forge.lso)

    // Teams
    implementation(forge.ftblibrary)
    implementation(forge.ftbteams)

    // Resourceful Lib
    implementation(forge.resourcefullib)

    // JourneyMap API — pack uses Xaero's; integration compiles against the API and no-ops at runtime.
    compileOnly(forge.journeymap.api)

    // Xaero's Minimap / World Map — pack ships Xaero's. compileOnly to build our own field-blob overlay
    // against their (internal) render classes; runtimeOnly so the dev client loads Xaero's to test it.
    compileOnly(forge.xaeroslib)
    compileOnly(forge.xaerosminimap)
    compileOnly(forge.xaerosworldmap)
    runtimeOnly(forge.xaeroslib)
    runtimeOnly(forge.xaerosminimap)
    runtimeOnly(forge.xaerosworldmap)

    // Sodium + Iris — dev runtime only, so the client renders fast and we can sanity-check render compat.
    runtimeOnly(forge.sodium)
    runtimeOnly(forge.iris)

    // Dev tooling
    runtimeOnly(forge.effortless)

    // ---- DROPPED for the 1.21.1 port (no NeoForge build / pack chose alternatives) ----
    // Forestry CE + Gendustry CE  -> no 1.21.1 (bee system shelved, see bead cosmiccore-42.2)
    // Embers Rekindled            -> no 1.21.1 (ember system shelved)
    // Ad Astra                    -> no 1.21.1 (isolate+no-op now, Stellaris later, bead cosmiccore-42.13)
    // Embeddium + Oculus          -> pack uses Sodium + Iris
    // Travel Anchors + LibX       -> not in pack
    // New Thin Air                -> discontinued
    // Modern AE2 Additions, ModKit, WorldEdit, World Stripper -> dropped
    // botarium / yabn / byteCodecs / resourcefulConfig -> Ad Astra stack, dropped with AA
    // Expanded AE 2.1.1           -> core mixin hard-refs Advanced AE (not in pack); CC has no code dep on it
}
