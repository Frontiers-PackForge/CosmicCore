base {
    archivesName = "${mod_id}-${libs.versions.minecraft.get()}"
}

java {
    withSourcesJar()
}

def nebulaeArtifactFile = file("$rootDir/libs/nebulaeae2-0.1.0.jar")
project.ext.nebulaeArtifactFile = nebulaeArtifactFile

def verifyNebulaeArtifact = tasks.register('verifyNebulaeArtifact') {
    doLast {
        if (!nebulaeArtifactFile.isFile()) {
            throw new GradleException(
                    "Missing vendored NebulaeAE2 artifact at ${nebulaeArtifactFile}.")
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn verifyNebulaeArtifact
}

afterEvaluate {
    tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
        destinationDirectory = file('build/libs/')
        manifest.attributes([
                'Specification-Title'  : mod_name,
                'Specification-Version': mod_version,
                'Specification-Vendor' : mod_authors,
                'Implementation-Title' : base.archivesName.get(),
                'Implementation-Version': version,
                'Implementation-Vendor': mod_authors,
        ])
    }
}

tasks.named('jar', org.gradle.jvm.tasks.Jar).configure {
    dependsOn verifyNebulaeArtifact
    from("$rootDir/libs/gtceu-1.21.1-8.0.0.jar") { into 'META-INF/jarjar' }
    from(nebulaeArtifactFile) { into 'META-INF/jarjar' }
    from(configurations.spaceGravityRuntime) {
        into 'META-INF/jarjar'
        rename { 'space_gravity-1.0.3.jar' }
    }
    from(configurations.mixinSquaredRuntime) { into 'META-INF/jarjar' }
    from("$rootDir/jarjar/metadata.json") { into 'META-INF/jarjar' }
}
