modLoader = "javafml"
loaderVersion = "[${loader_version},)"
issueTrackerURL = "${mod_issue_tracker}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "cosmiccore.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "gtceu"
    type = "required"
    versionRange = "[${gtceu_version},)"
    ordering = "AFTER"
    side = "BOTH"

# GTCEu 8.0 dropped LDLib (it moved to ModularUI2), so it no longer brings LDLib transitively.
# CosmicCore still uses LDLib directly (gui widgets, @Persisted/@DescSynced syncdata, BlockInfo, the
# IRenderer/IItemRendererProvider item-render API), so CC must require LDLib itself. Load AFTER it.
# (Min version pinned in forge.versions.toml = ${ldlib_version}; range left open so the pack can ship newer.)
[[dependencies.${mod_id}]]
    modId = "ldlib"
    type = "required"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "embers"
    type = "required"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "undergarden"
    type = "optional"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "space_gravity"
    type = "optional"
    versionRange = "[1.0.3,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "veil"
    type = "optional"
    versionRange = "[4.1.4,)"
    ordering = "AFTER"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "nebulaeae2"
    type = "required"
    versionRange = "[0.1.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "journeymap"
    type = "incompatible"
    reason = "Custom ore field integration is only supported with Xaero's Minimap and Xaero's World Map."
    versionRange = "*"
    ordering = "NONE"
    side = "CLIENT"
